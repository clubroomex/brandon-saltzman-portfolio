bio: >
  I'm a founder and builder who works across the full stack of a product: strategy,
  design, engineering, and the go-to-market motion to get it in front of real users.
  At Method CRM I've served 100+ SMB clients as a solutions consultant and built the
  Professional Services team's AI tooling layer — call auditing, automated pre-call
  intelligence, and a library of LLM skills now used by leadership. Before that I ran
  data and revenue operations at a fitness club through a growth period, and before
  that I was a research scientist (MSc, McGill — two peer-reviewed publications).
  The common thread: find the systemic problem, build the fix, measure whether it
  worked. I'm looking for product management or revenue operations roles at companies
  building products that will win in an AI-first landscape.
